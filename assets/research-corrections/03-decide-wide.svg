<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Three matches, three review tasks</title><desc id="desc">No match: Read the changed wording. Reconsider the code. One match: Repair the locator. Inspect its context. Two matches: Resolve the occurrence. Do not pick silently.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="72" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Three matches, three review tasks</text><rect x="48" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="48" y="180" width="6" height="300" fill="#b94332"/><text x="76" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">No match</text><text x="76" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Read the changed</text><text x="76" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">wording. Reconsider the</text><text x="76" y="400" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">code.</text><rect x="430" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="430" y="180" width="6" height="300" fill="#b94332"/><text x="458" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">One match</text><text x="458" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Repair the locator.</text><text x="458" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Inspect its context.</text><rect x="812" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="812" y="180" width="6" height="300" fill="#b94332"/><text x="840" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Two matches</text><text x="840" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Resolve the occurrence.</text><text x="840" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Do not pick silently.</text><text x="48" y="596" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">All code transfers in this exercise remain pending.</text></svg>