<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Keep derived reading copies separate</title><desc id="desc">P01 and P04: Two declared source dependencies D06: derived copy: A written combination; no new spoken turn Missing source: Keep the limitation visible; do not invent it</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="72" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Keep derived reading copies separate</text><rect x="48" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="48" y="180" width="6" height="300" fill="#b94332"/><text x="76" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">P01 and P04</text><text x="76" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Two declared source</text><text x="76" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">dependencies</text><rect x="430" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="430" y="180" width="6" height="300" fill="#b94332"/><text x="458" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">D06: derived copy</text><text x="458" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">A written</text><text x="458" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">combination; no new</text><text x="458" y="400" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">spoken turn</text><rect x="812" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="812" y="180" width="6" height="300" fill="#b94332"/><text x="840" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Missing source</text><text x="840" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Keep the limitation</text><text x="840" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">visible; do not</text><text x="840" y="400" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">invent it</text><text x="48" y="596" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">Twelve record checks cannot assess language accuracy or consent.</text></svg>