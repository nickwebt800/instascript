<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Read the exported file</title><desc id="desc">Plain TXT: Edited words, joined by spaces. TXT with starts: Start anchors, no end times. SRT companion: Cue intervals, no review history.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="72" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Read the exported file</text><rect x="48" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="48" y="180" width="6" height="300" fill="#b94332"/><text x="76" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Plain TXT</text><text x="76" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Edited words, joined</text><text x="76" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">by spaces.</text><rect x="430" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="430" y="180" width="6" height="300" fill="#b94332"/><text x="458" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">TXT with starts</text><text x="458" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Start anchors, no</text><text x="458" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">end times.</text><rect x="812" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="812" y="180" width="6" height="300" fill="#b94332"/><text x="840" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">SRT companion</text><text x="840" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Cue intervals, no</text><text x="840" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">review history.</text><text x="48" y="596" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">Fictional replacements; no recording was checked.</text></svg>