<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">Name the review boundary</title><desc id="desc">Checked: 0-20 and 35-50 seconds Unchecked: 20-35 and 50-120 seconds Unresolved: Checked is not approved</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="72" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Name the review boundary</text><rect x="48" y="200" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="200" width="6" height="205" fill="#b94332"/><text x="76" y="253" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Checked</text><text x="76" y="309" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">0-20 and 35-50 seconds</text><rect x="48" y="440" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="440" width="6" height="205" fill="#b94332"/><text x="76" y="493" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Unchecked</text><text x="76" y="549" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">20-35 and 50-120 seconds</text><rect x="48" y="680" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="680" width="6" height="205" fill="#b94332"/><text x="76" y="733" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Unresolved</text><text x="76" y="789" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Checked is not approved</text><text x="48" y="1016" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">Fictional timeline; no recording or</text><text x="48" y="1053" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">listening.</text></svg>