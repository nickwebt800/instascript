<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title"><title id="title">Splitting display rows leaves source people unchanged</title><rect width="360" height="360" fill="#f6f3ec"/><g font-family="Arial" fill="#173c37"><text x="24" y="40" font-size="21">More bullets, same sources</text><text x="24" y="85" font-size="18">Layout A: 2 rows</text><text x="24" y="115" font-size="18">F01 / T01 + F02 / T02</text><path d="M24 145H330" stroke="#b9c8c0"/><text x="24" y="185" font-size="18">Layout B: 3 rows</text><text x="24" y="215" font-size="18">F01 / T01 appears twice</text><text x="24" y="265" font-size="22">Still 2 source people</text><text x="24" y="325" font-size="14">Fictional exercise; no recording.</text></g></svg>
