<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Keep unresolved links visible</title><desc id="desc">Keep scope: Project, interview, version Inspect link: Missing or duplicate? Stop. State limits: A record is not identity proof</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="72" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Keep unresolved links visible</text><rect x="48" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="48" y="180" width="6" height="300" fill="#b94332"/><text x="76" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Keep scope</text><text x="76" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Project, interview,</text><text x="76" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">version</text><rect x="430" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="430" y="180" width="6" height="300" fill="#b94332"/><text x="458" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Inspect link</text><text x="458" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Missing or</text><text x="458" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">duplicate? Stop.</text><rect x="812" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="812" y="180" width="6" height="300" fill="#b94332"/><text x="840" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">State limits</text><text x="840" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">A record is not</text><text x="840" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">identity proof</text><text x="48" y="596" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">Manual practice. No speaker recognition or identity verification.</text></svg>