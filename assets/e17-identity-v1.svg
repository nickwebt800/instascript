<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title"><title id="title">Copied displays and equal wording require different identity checks</title><rect width="360" height="360" fill="#f6f3ec"/><g font-family="Arial" fill="#173c37"><text x="24" y="42" font-size="21">What makes a duplicate?</text><text x="24" y="105" font-size="18">Same words, different people:</text><text x="24" y="137" font-size="18">do not erase a source.</text><text x="24" y="205" font-size="18">Same fragment copied twice:</text><text x="24" y="237" font-size="18">do not invent a source.</text><text x="24" y="290" font-size="18">Declare the counting unit.</text><text x="24" y="332" font-size="14">Fictional exercise; no method validation.</text></g></svg>
