<svg xmlns="http://www.w3.org/2000/svg" width="352" height="516" viewBox="0 0 352 516"><title>What must each SRT block contain?</title><desc>Crops of the actual local tool on October 23, 2026.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="16" y="28" fill="#172033" font-size="17">What must each SRT block contain?</text><g transform="translate(8 51)"><rect width="336" height="256.80906148867314" rx="8" fill="#fff" stroke="#d5dbe3"/><image x="16" y="20" width="304" height="216.80906148867314" href="data:image/png;base64,"/></g><g transform="translate(8 323.80906148867314)"><rect width="336" height="180" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="38" fill="#172033" font-size="15">Check before continuing</text><text x="16" y="78" fill="#475467" font-size="14">Every source block is complete,</text><text x="16" y="99" fill="#475467" font-size="14">including the last one.</text></g></g></svg>