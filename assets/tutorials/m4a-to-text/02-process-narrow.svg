<svg xmlns="http://www.w3.org/2000/svg" width="352" height="601" viewBox="0 0 352 601"><title>Why does the first transcription take longer?</title><desc>Crops of the actual local tool on October 23, 2026.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="16" y="28" fill="#172033" font-size="17">Why does the first transcription</text><text x="16" y="52" fill="#172033" font-size="17">take longer?</text><g transform="translate(8 76)"><rect width="336" height="294.5473760932945" rx="8" fill="#fff" stroke="#d5dbe3"/><image x="16" y="20" width="304" height="254.54737609329447" href="data:image/png;base64,"/></g><g transform="translate(8 386.5473760932945)"><rect width="336" height="202" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="38" fill="#172033" font-size="15">Check before continuing</text><text x="16" y="78" fill="#475467" font-size="14">The processing message describes</text><text x="16" y="99" fill="#475467" font-size="14">the current stage; a cached file</text><text x="16" y="120" fill="#475467" font-size="14">is not proof that initialization</text><text x="16" y="141" fill="#475467" font-size="14">has finished.</text></g></g></svg>