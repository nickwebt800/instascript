<svg xmlns="http://www.w3.org/2000/svg" width="720" height="265" viewBox="0 0 720 265"><title>What should I do if the file will not decode or the task stops?</title><desc>Crops of the actual local tool on October 23, 2026.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="16" y="28" fill="#172033" font-size="17">What should I do if the file will not decode or the task stops?</text><g transform="translate(8 51)"><rect width="336" height="202" rx="8" fill="#fff" stroke="#d5dbe3"/><image x="16" y="20" width="304" height="112.58746355685132" href="data:image/png;base64,"/></g><g transform="translate(368 51)"><rect width="336" height="202" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="38" fill="#172033" font-size="15">Check before continuing</text><text x="16" y="78" fill="#475467" font-size="14">Retry uses a playable original or</text><text x="16" y="99" fill="#475467" font-size="14">a genuinely converted copy, rather</text><text x="16" y="120" fill="#475467" font-size="14">than the deliberately damaged</text><text x="16" y="141" fill="#475467" font-size="14">teaching file.</text></g></g></svg>