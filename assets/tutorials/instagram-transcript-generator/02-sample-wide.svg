<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img"><title>Try the controls with prepared text</title><desc>Actual InstaScript interface crops. Prepared sample and real speech recognition are labeled separately. Public-domain JFK audio is used for the local-file example.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="19" font-weight="700">Try the controls with prepared text</text><g transform="translate(8 58)"><rect width="336" height="230" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Open the prepared sample</text><image x="16" y="62" width="107" height="44" href="data:image/png;base64,"/><image x="16" y="122" width="301" height="66.046875" href="data:image/png;base64,"/></g><g transform="translate(368 58)"><rect width="336" height="230" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Edit or export the example</text><image x="16" y="62" width="233" height="69.1875" href="data:image/png;base64,"/><text x="16" y="159.1875" font-size="13" fill="#475467">This is not a live recognition result.</text></g></g></svg>