<svg xmlns="http://www.w3.org/2000/svg" width="352" height="721" viewBox="0 0 352 721" role="img"><title>Start the real transcription</title><desc>Actual InstaScript interface crops. Prepared sample and real speech recognition are labeled separately. Public-domain JFK audio is used for the local-file example.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="16" font-weight="700">Start the real transcription</text><g transform="translate(8 58)"><rect width="336" height="230" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Start your selected file</text><image x="16" y="62" width="261" height="44" href="data:image/png;base64,"/><text x="16" y="134" font-size="13" fill="#475467">English speech only; up to 100 MB.</text><text x="16" y="163" font-size="13" fill="#475467">Both speech models may need to load.</text></g><g transform="translate(8 304)"><rect width="336" height="405" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Read the current status</text><image x="16" y="62" width="304" height="289.84223300970876" href="data:image/png;base64,"/><text x="16" y="379.84223300970876" font-size="13" fill="#475467">Wait for a result or a clear error.</text></g></g></svg>