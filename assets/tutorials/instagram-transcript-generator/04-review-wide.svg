<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img"><title>Review the recognized words</title><desc>Actual InstaScript interface crops. Prepared sample and real speech recognition are labeled separately. Public-domain JFK audio is used for the local-file example.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="19" font-weight="700">Review the recognized words</text><g transform="translate(8 58)"><rect width="336" height="282" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Actual English recognition</text><image x="16" y="62" width="225" height="167" href="data:image/png;base64,"/><text x="16" y="257" font-size="13" fill="#475467">Check words against the recording.</text></g><g transform="translate(368 58)"><rect width="336" height="282" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">A manual punctuation edit</text><image x="16" y="62" width="225" height="167" href="data:image/png;base64,"/><text x="16" y="257" font-size="13" fill="#475467">Downloads use your edited text.</text></g></g></svg>