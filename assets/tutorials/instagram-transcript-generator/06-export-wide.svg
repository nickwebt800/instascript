<svg xmlns="http://www.w3.org/2000/svg" width="720" height="349" viewBox="0 0 720 349" role="img"><title>Choose text notes or timed subtitles</title><desc>Actual InstaScript interface crops. Prepared sample and real speech recognition are labeled separately. Public-domain JFK audio is used for the local-file example.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="19" font-weight="700">Choose text notes or timed subtitles</text><g transform="translate(8 58)"><rect width="336" height="279" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Choose the output format</text><image x="16" y="62" width="52" height="44" href="data:image/png;base64,"/><image x="16" y="122" width="52" height="44" href="data:image/png;base64,"/><image x="16" y="182" width="52" height="44" href="data:image/png;base64,"/><text x="16" y="254" font-size="13" fill="#475467">SRT/VTT need complete valid timing.</text></g><g transform="translate(368 58)"><rect width="336" height="279" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Check the saved SRT</text><rect x="16" y="57" width="304" height="138" rx="6" fill="#f6f7f8" stroke="#d5dbe3"/><text x="25" y="78" font-family="Consolas,monospace" font-size="13">1</text><text x="25" y="101" font-family="Consolas,monospace" font-size="13">00:00:00,000 --&gt; 00:00:07,740</text><text x="25" y="124" font-family="Consolas,monospace" font-size="13">And so, my fellow Americans: ask</text><text x="25" y="147" font-family="Consolas,monospace" font-size="13">not what your country can do for</text><text x="25" y="170" font-family="Consolas,monospace" font-size="13">you</text><text x="16" y="219" font-size="13" fill="#475467">Excerpt from the actual download.</text></g></g></svg>