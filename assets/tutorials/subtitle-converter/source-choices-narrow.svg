<svg xmlns="http://www.w3.org/2000/svg" width="352" height="525" viewBox="0 0 352 525"><title>Decide which information may be lost</title><desc>Conceptual guide, not an app screenshot. SRT → VTT. Keep valid timing and line breaks. Remove source styling. ASS → SRT. Keep usable dialogue and times. Lose fonts / positions / animation. SRT/VTT → TXT. Keep a reading copy. Remove timing and cue numbers</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="16" y="28" fill="#172033" font-size="17">Decide which information may be</text><text x="16" y="52" fill="#172033" font-size="17">lost</text><g transform="translate(8 78)"><rect width="336" height="133" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">SRT → VTT</text><text x="16" y="87" fill="#475467" font-size="13">Keep valid timing and line breaks</text><text x="16" y="121" fill="#475467" font-size="13">Remove source styling</text></g><g transform="translate(8 227)"><rect width="336" height="133" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">ASS → SRT</text><text x="16" y="87" fill="#475467" font-size="13">Keep usable dialogue and times</text><text x="16" y="121" fill="#475467" font-size="13">Lose fonts / positions / animation</text></g><g transform="translate(8 376)"><rect width="336" height="133" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">SRT/VTT → TXT</text><text x="16" y="87" fill="#475467" font-size="13">Keep a reading copy</text><text x="16" y="121" fill="#475467" font-size="13">Remove timing and cue numbers</text></g></g></svg>