<svg xmlns="http://www.w3.org/2000/svg" width="352" height="576" viewBox="0 0 352 576" role="img"><title>Save a file you can check</title><desc>Annotated crops of the real InstaScript Subtitle Editor, using a public-domain practice recording and prepared subtitles.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="16" font-weight="700">Save a file you can check</text><g transform="translate(8 58)"><rect width="336" height="245" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Choose SRT or VTT</text><image x="16" y="62" width="117" height="40" href="data:image/png;base64,"/><image x="16" y="118" width="117" height="40" href="data:image/png;base64,"/><text x="16" y="186" font-size="13" fill="#475467">Use the format your player accepts.</text><text x="16" y="215" font-size="13" fill="#475467">Download before closing the tab.</text></g><g transform="translate(8 319)"><rect width="336" height="245" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Inspect the downloaded file</text><rect x="16" y="57" width="304" height="92" rx="6" fill="#f6f7f8" stroke="#d5dbe3"/><text x="25" y="78" font-family="Consolas,monospace" font-size="13">1</text><text x="25" y="101" font-family="Consolas,monospace" font-size="13">00:00:00,000 --&gt; 00:00:03,600</text><text x="25" y="124" font-family="Consolas,monospace" font-size="13">And so, my fellow Americans!</text><text x="16" y="173" font-size="13" fill="#475467">This is the actual SRT download.</text><text x="16" y="202" font-size="13" fill="#475467">Reopen it to check words and times.</text></g></g></svg>