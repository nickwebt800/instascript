<svg xmlns="http://www.w3.org/2000/svg" width="352" height="652" viewBox="0 0 352 652" role="img"><title>Fix invalid cues to unlock export</title><desc>Annotated crops of the real InstaScript Subtitle Editor, using a public-domain practice recording and prepared subtitles.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="16" font-weight="700">Fix invalid cues to unlock export</text><g transform="translate(8 58)"><rect width="336" height="258" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Find the invalid time</text><text x="16" y="74" font-size="13" fill="#475467">Start and End are both zero.</text><image x="16" y="91" width="304" height="75" href="data:image/png;base64,"/><image x="16" y="182" width="304" height="22.151294498381876" href="data:image/png;base64,"/><text x="16" y="232.15129449838187" font-size="13" fill="#475467">This error was made for the example.</text></g><g transform="translate(8 332)"><rect width="336" height="308" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Repair the cue, then export</text><text x="16" y="74" font-size="13" fill="#475467">Before repair: export is disabled.</text><image x="16" y="91" width="117" height="40" href="data:image/png;base64,"/><text x="16" y="159" font-size="13" fill="#475467">Set End later than Start.</text><text x="16" y="188" font-size="13" fill="#475467">Make sure the Caption is not empty.</text><image x="16" y="205" width="300" height="22.515625" href="data:image/png;base64,"/><image x="16" y="243.515625" width="117" height="40" href="data:image/png;base64,"/></g></g></svg>