<svg xmlns="http://www.w3.org/2000/svg" width="720" height="374" viewBox="0 0 720 374" role="img"><title>Edit a cue in its own row</title><desc>Annotated crops of the real InstaScript Subtitle Editor, using a public-domain practice recording and prepared subtitles.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="19" font-weight="700">Edit a cue in its own row</text><g transform="translate(8 58)"><rect width="336" height="304" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Check Start and End</text><text x="16" y="74" font-size="13" fill="#475467">Start (left) / End (right)</text><image x="16" y="91" width="304" height="75" href="data:image/png;base64,"/><text x="16" y="194" font-size="13" fill="#475467">End must be later than Start.</text><image x="16" y="211" width="92" height="40" href="data:image/png;base64,"/><text x="16" y="279" font-size="13" fill="#475467">A new entry needs text to export.</text></g><g transform="translate(368 58)"><rect width="336" height="304" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Change the Caption text</text><text x="16" y="74" font-size="13" fill="#475467">Before</text><image x="16" y="91" width="304" height="52.114285714285714" href="data:image/png;base64,"/><text x="16" y="171.1142857142857" font-size="13" fill="#475467">After a punctuation edit</text><image x="16" y="188.1142857142857" width="304" height="52.114285714285714" href="data:image/png;base64,"/></g></g></svg>