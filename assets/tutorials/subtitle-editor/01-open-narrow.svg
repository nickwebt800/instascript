<svg xmlns="http://www.w3.org/2000/svg" width="352" height="627" viewBox="0 0 352 627" role="img"><title>Open the file, then load it</title><desc>Annotated crops of the real InstaScript Subtitle Editor, using a public-domain practice recording and prepared subtitles.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="16" font-weight="700">Open the file, then load it</text><g transform="translate(8 58)"><rect width="336" height="296" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Choose one subtitle file</text><image x="16" y="62" width="174" height="42" href="data:image/png;base64,"/><image x="16" y="120" width="304" height="122.56507936507937" href="data:image/png;base64,"/><text x="16" y="270.5650793650794" font-size="13" fill="#475467">The file fills the text box.</text></g><g transform="translate(8 370)"><rect width="336" height="245" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Load the editable rows</text><image x="16" y="62" width="160" height="42" href="data:image/png;base64,"/><image x="16" y="120" width="304" height="21.729365079365078" href="data:image/png;base64,"/><text x="16" y="169.7293650793651" font-size="13" fill="#475467">Each cue becomes one row.</text><text x="16" y="198.7293650793651" font-size="13" fill="#475467">Pasting text works here, too.</text></g></g></svg>