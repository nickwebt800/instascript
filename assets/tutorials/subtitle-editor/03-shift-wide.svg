<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img"><title>Move all cues by the same amount</title><desc>Annotated crops of the real InstaScript Subtitle Editor, using a public-domain practice recording and prepared subtitles.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="19" font-weight="700">Move all cues by the same amount</text><g transform="translate(8 58)"><rect width="336" height="310" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Enter an offset in seconds</text><image x="16" y="62" width="270" height="68.5" href="data:image/png;base64,"/><text x="16" y="158.5" font-size="13" fill="#475467">+0.5 moves all cues later.</text><text x="16" y="187.5" font-size="13" fill="#475467">-0.5 moves all cues earlier.</text><text x="16" y="216.5" font-size="13" fill="#475467">Click Apply shift once, then check.</text></g><g transform="translate(368 58)"><rect width="336" height="310" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Check cue 2 after +0.5</text><text x="16" y="74" font-size="13" fill="#475467">Before: Start / End</text><image x="16" y="91" width="304" height="75" href="data:image/png;base64,"/><text x="16" y="194" font-size="13" fill="#475467">After: Start / End</text><image x="16" y="211" width="304" height="75" href="data:image/png;base64,"/></g></g></svg>