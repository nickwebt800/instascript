<svg xmlns="http://www.w3.org/2000/svg" width="352" height="585" viewBox="0 0 352 585" role="img"><title>Listen before you export</title><desc>Annotated crops of the real InstaScript Subtitle Editor, using a public-domain practice recording and prepared subtitles.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="16" font-weight="700">Listen before you export</text><g transform="translate(8 58)"><rect width="336" height="245" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Open your local recording</text><image x="16" y="62" width="209" height="42" href="data:image/png;base64,"/><image x="16" y="120" width="304" height="53.12621359223301" href="data:image/png;base64,"/><text x="16" y="201.126213592233" font-size="13" fill="#475467">The recording stays in this tab.</text></g><g transform="translate(8 319)"><rect width="336" height="254" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Click a cue number to replay</text><image x="16" y="62" width="25" height="40" href="data:image/png;base64,"/><image x="16" y="118" width="304" height="53.12621359223301" href="data:image/png;base64,"/><text x="16" y="199.126213592233" font-size="13" fill="#475467">Cue 2 starts at 3.600 seconds.</text><text x="16" y="228.126213592233" font-size="13" fill="#475467">Player controls show whole seconds.</text></g></g></svg>