<svg xmlns="http://www.w3.org/2000/svg" width="720" height="242" viewBox="0 0 720 242"><title>Three checks before publishing captions</title><desc>Conceptual guide, not an app screenshot. Words. Replay and correct. Keep negations and numbers. Timing. Check cue starts and ends. Use Subtitle Editor if needed. Presentation. Preview in the destination. No burn-in renderer here</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="16" y="28" fill="#172033" font-size="17">Three checks before publishing captions</text><g transform="translate(8 53)"><rect width="224" height="173" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">Words</text><text x="16" y="87" fill="#475467" font-size="13">Replay and correct</text><text x="16" y="121" fill="#475467" font-size="13">Keep negations and</text><text x="16" y="141" fill="#475467" font-size="13">numbers</text></g><g transform="translate(248 53)"><rect width="224" height="173" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">Timing</text><text x="16" y="87" fill="#475467" font-size="13">Check cue starts and</text><text x="16" y="107" fill="#475467" font-size="13">ends</text><text x="16" y="141" fill="#475467" font-size="13">Use Subtitle Editor if</text><text x="16" y="161" fill="#475467" font-size="13">needed</text></g><g transform="translate(488 53)"><rect width="224" height="173" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">Presentation</text><text x="16" y="87" fill="#475467" font-size="13">Preview in the</text><text x="16" y="107" fill="#475467" font-size="13">destination</text><text x="16" y="141" fill="#475467" font-size="13">No burn-in renderer here</text></g></g></svg>