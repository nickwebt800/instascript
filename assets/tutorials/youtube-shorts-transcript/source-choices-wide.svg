<svg xmlns="http://www.w3.org/2000/svg" width="720" height="242" viewBox="0 0 720 242"><title>From a Short to a verifiable quotation</title><desc>Conceptual guide, not an app screenshot. Existing track. Read in YouTube Transcript. Language choice then resubmit. Source timestamp. Opens YouTube externally. Replay around the cut. Quote / subtitle. Keep source / inspect cue ends. No OCR or new captions</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="16" y="28" fill="#172033" font-size="17">From a Short to a verifiable quotation</text><g transform="translate(8 53)"><rect width="224" height="173" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">Existing track</text><text x="16" y="87" fill="#475467" font-size="13">Read in YouTube</text><text x="16" y="107" fill="#475467" font-size="13">Transcript</text><text x="16" y="141" fill="#475467" font-size="13">Language choice then</text><text x="16" y="161" fill="#475467" font-size="13">resubmit</text></g><g transform="translate(248 53)"><rect width="224" height="173" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">Source timestamp</text><text x="16" y="87" fill="#475467" font-size="13">Opens YouTube externally</text><text x="16" y="121" fill="#475467" font-size="13">Replay around the cut</text></g><g transform="translate(488 53)"><rect width="224" height="173" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">Quote / subtitle</text><text x="16" y="87" fill="#475467" font-size="13">Keep source / inspect</text><text x="16" y="107" fill="#475467" font-size="13">cue ends</text><text x="16" y="141" fill="#475467" font-size="13">No OCR or new captions</text></g></g></svg>