<svg xmlns="http://www.w3.org/2000/svg" width="352" height="525" viewBox="0 0 352 525"><title>From a Short to a verifiable quotation</title><desc>Conceptual guide, not an app screenshot. Existing track. Read in YouTube Transcript. Language choice then resubmit. Source timestamp. Opens YouTube externally. Replay around the cut. Quote / subtitle. Keep source / inspect cue ends. No OCR or new captions</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="16" y="28" fill="#172033" font-size="17">From a Short to a verifiable</text><text x="16" y="52" fill="#172033" font-size="17">quotation</text><g transform="translate(8 78)"><rect width="336" height="133" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">Existing track</text><text x="16" y="87" fill="#475467" font-size="13">Read in YouTube Transcript</text><text x="16" y="121" fill="#475467" font-size="13">Language choice then resubmit</text></g><g transform="translate(8 227)"><rect width="336" height="133" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">Source timestamp</text><text x="16" y="87" fill="#475467" font-size="13">Opens YouTube externally</text><text x="16" y="121" fill="#475467" font-size="13">Replay around the cut</text></g><g transform="translate(8 376)"><rect width="336" height="133" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">Quote / subtitle</text><text x="16" y="87" fill="#475467" font-size="13">Keep source / inspect cue ends</text><text x="16" y="121" fill="#475467" font-size="13">No OCR or new captions</text></g></g></svg>