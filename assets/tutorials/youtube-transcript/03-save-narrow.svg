<svg xmlns="http://www.w3.org/2000/svg" width="352" height="435" viewBox="0 0 352 435"><title>How do I save a reading copy with its source?</title><desc>Prepared teaching captions, not a successful live query.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="16" y="28" fill="#172033" font-size="17">Read and verify a caption track</text><text x="16" y="64" fill="#8b3527" font-size="12">Prepared example — not a live query</text><g transform="translate(8 76)"><rect width="336" height="128.87707641196013" rx="8" fill="#fff" stroke="#d5dbe3"/><image x="16" y="20" width="304" height="88.87707641196013" href="data:image/png;base64,"/></g><g transform="translate(8 220.87707641196013)"><rect width="336" height="202" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="38" fill="#172033" font-size="15">Check before continuing</text><text x="16" y="78" fill="#475467" font-size="14">The actual downloaded note</text><text x="16" y="99" fill="#475467" font-size="14">contains the intended track and</text><text x="16" y="120" fill="#475467" font-size="14">source information; editorial</text><text x="16" y="141" fill="#475467" font-size="14">notes are clearly your own.</text></g></g></svg>