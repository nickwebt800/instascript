<svg xmlns="http://www.w3.org/2000/svg" width="352" height="505" viewBox="0 0 352 505" role="img"><title>Choose the format before editing</title><desc>Copy result and Download result controls, and Output format changed to VTT, which regenerates the output from parsed source cues.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Choose the format before editing</text><g transform="translate(8 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Save the current result box</text><image x="16" y="58" width="304" height="94.44660194174757" href="data:image/png;base64,"/><text x="16" y="180.4466019417476" font-size="13" fill="#475467">Copy and download use your edits.</text></g><g transform="translate(8 283)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Switching format rebuilds text</text><image x="16" y="58" width="304" height="61.780744336569576" href="data:image/png;base64,"/><text x="16" y="147.78074433656957" font-size="13" fill="#475467">Changing to VTT resets result edits.</text><text x="16" y="176.78074433656957" font-size="13" fill="#475467">Download before switching formats.</text></g></g></svg>