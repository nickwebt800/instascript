<svg xmlns="http://www.w3.org/2000/svg" width="720" height="279" viewBox="0 0 720 279" role="img"><title>Compare the count and time range</title><desc>Actual two-cue conversion summary and downloaded SRT first cue showing the 1.200 to 3.400 second range.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="19" font-weight="700">Compare the count and time range</text><g transform="translate(8 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Read the conversion summary</text><image x="16" y="58" width="304" height="21.15210355987055" href="data:image/png;base64,"/><text x="16" y="107.15210355987055" font-size="13" fill="#475467">Practice input: two cues.</text></g><g transform="translate(368 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Read the actual SRT download</text><rect x="16" y="54" width="304" height="84" rx="6" fill="#f6f7f8"/><text x="23" y="72" font-family="Consolas,monospace" font-size="12">1</text><text x="23" y="94" font-family="Consolas,monospace" font-size="12">00:00:01,200 --&gt; 00:00:03,400</text><text x="23" y="116" font-family="Consolas,monospace" font-size="12">Open the garden gate.</text><text x="16" y="166" font-size="13" fill="#475467">Original start and end are retained.</text></g></g></svg>