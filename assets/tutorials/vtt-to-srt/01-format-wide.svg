<svg xmlns="http://www.w3.org/2000/svg" width="720" height="279" viewBox="0 0 720 279" role="img"><title>Choose the destination format</title><desc>Open VTT, SRT or SBV, Convert subtitle, and the Output format selector set to SRT.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="19" font-weight="700">Choose the destination format</text><g transform="translate(8 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Open a subtitle source</text><image x="16" y="58" width="304" height="41.320388349514566" href="data:image/png;base64,"/><image x="16" y="115.32038834951456" width="304" height="41.320388349514566" href="data:image/png;base64,"/></g><g transform="translate(368 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Select SRT for VTT to SRT</text><image x="16" y="58" width="304" height="61.780744336569576" href="data:image/png;base64,"/><text x="16" y="147.78074433656957" font-size="13" fill="#475467">The selector controls the output.</text></g></g></svg>