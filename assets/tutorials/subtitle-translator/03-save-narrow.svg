<svg xmlns="http://www.w3.org/2000/svg" width="352" height="505" viewBox="0 0 352 505" role="img"><title>Save the wording with its timing</title><desc>Download translated SRT control and the actual saved Spanish first cue with its unchanged 1.200 to 3.400 second time range.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Save the wording with its timing</text><g transform="translate(8 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Download the current translation</text><image x="16" y="58" width="304" height="41.320388349514566" href="data:image/png;base64,"/><image x="16" y="115.32038834951456" width="304" height="21.15210355987055" href="data:image/png;base64,"/></g><g transform="translate(8 283)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Read the actual saved cue</text><rect x="16" y="54" width="304" height="84" rx="6" fill="#f6f7f8"/><text x="23" y="72" font-family="Consolas,monospace" font-size="12">1</text><text x="23" y="94" font-family="Consolas,monospace" font-size="12">00:00:01,200 --&gt; 00:00:03,400</text><text x="23" y="116" font-family="Consolas,monospace" font-size="12">Abre la puerta del jardín.</text><text x="16" y="166" font-size="13" fill="#475467">The time range is unchanged.</text></g></g></svg>