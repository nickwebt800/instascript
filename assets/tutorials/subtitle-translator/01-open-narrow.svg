<svg xmlns="http://www.w3.org/2000/svg" width="352" height="540" viewBox="0 0 352 540" role="img"><title>Open the file and read the row</title><desc>Open SRT or VTT loads cues immediately; the first Translation field contains the original garden instruction.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Open the file and read the row</text><g transform="translate(8 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Select one local subtitle file</text><image x="16" y="58" width="304" height="41.320388349514566" href="data:image/png;base64,"/><text x="16" y="127.32038834951456" font-size="13" fill="#475467">Cues load automatically.</text></g><g transform="translate(8 283)"><rect width="336" height="245" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. The field starts with source words</text><image x="16" y="58" width="304" height="135.76699029126215" href="data:image/png;base64,"/><text x="16" y="221.76699029126215" font-size="13" fill="#475467">Prefilled text is not a translation.</text></g></g></svg>