<svg xmlns="http://www.w3.org/2000/svg" width="352" height="620" viewBox="0 0 352 620" role="img"><title>Replace the prefilled words</title><desc>Manually entered Spanish in the first Translation field and a deliberately blank second field whose actual SRT export retains Walk along the path.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Replace the prefilled words</text><g transform="translate(8 57)"><rect width="336" height="245" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Enter your own wording</text><image x="16" y="58" width="304" height="135.76699029126215" href="data:image/png;base64,"/><text x="16" y="221.76699029126215" font-size="13" fill="#475467">Spanish was typed manually.</text></g><g transform="translate(8 318)"><rect width="336" height="290" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. A blank field keeps its source</text><image x="16" y="58" width="304" height="135.76699029126215" href="data:image/png;base64,"/><rect x="16" y="205.76699029126215" width="304" height="62" rx="6" fill="#f6f7f8"/><text x="23" y="223.76699029126215" font-family="Consolas,monospace" font-size="12">00:00:03,500 --&gt; 00:00:06,000</text><text x="23" y="245.76699029126215" font-family="Consolas,monospace" font-size="12">Walk along the path.</text></g></g></svg>