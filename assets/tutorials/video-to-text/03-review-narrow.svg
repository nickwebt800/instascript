<svg xmlns="http://www.w3.org/2000/svg" width="352" height="580" viewBox="0 0 352 580" role="img"><title>Replay a cue and edit its words</title><desc>Local recording player and an actual recognized cue edited with a deliberate reviewed marker.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Replay a cue and edit its words</text><g transform="translate(8 57)"><rect width="336" height="285" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Listen to the local recording</text><image x="16" y="58" width="304" height="204.6957478005865" href="data:image/png;base64,"/></g><g transform="translate(8 358)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Edit the recognized wording</text><image x="16" y="58" width="233" height="69.1875" href="data:image/png;base64,"/><text x="16" y="155.1875" font-size="13" fill="#475467">“[reviewed]” is a teaching edit.</text></g></g></svg>