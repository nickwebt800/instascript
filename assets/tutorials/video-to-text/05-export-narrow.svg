<svg xmlns="http://www.w3.org/2000/svg" width="352" height="549" viewBox="0 0 352 549" role="img"><title>Choose words or timed subtitles</title><desc>TXT, Markdown, SRT and VTT controls, the text timestamp checkbox, and an actual edited SRT download.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Choose words or timed subtitles</text><g transform="translate(8 57)"><rect width="336" height="231" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Use the current result controls</text><image x="16" y="58" width="301" height="88" href="data:image/png;base64,"/><image x="16" y="162" width="301" height="46.09375" href="data:image/png;base64,"/></g><g transform="translate(8 304)"><rect width="336" height="233" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Read an actual edited download</text><rect x="16" y="54" width="304" height="128" rx="6" fill="#f6f7f8"/><text x="23" y="72" font-family="Consolas,monospace" font-size="12">1</text><text x="23" y="94" font-family="Consolas,monospace" font-size="12">00:00:00,000 --&gt; 00:00:07,740</text><text x="23" y="116" font-family="Consolas,monospace" font-size="12">And so my fellow Americans ask</text><text x="23" y="138" font-family="Consolas,monospace" font-size="12">not what your country can do for</text><text x="23" y="160" font-family="Consolas,monospace" font-size="12">you [reviewed]</text><text x="16" y="210" font-size="13" fill="#475467">An SRT needs complete cue timing.</text></g></g></svg>