<svg xmlns="http://www.w3.org/2000/svg" width="720" height="373" viewBox="0 0 720 373" role="img"><title>Read the processing stage</title><desc>Actual processing status and cancel control, alongside the decode, language-check and transcription stages.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="19" font-weight="700">Read the processing stage</text><g transform="translate(8 57)"><rect width="336" height="304" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. A real processing state</text><image x="16" y="58" width="304" height="223.7762390670554" href="data:image/png;base64,"/></g><g transform="translate(368 57)"><rect width="336" height="304" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Allow the stages to finish</text><text x="16" y="70" font-size="13" fill="#475467">Decode the recording.</text><text x="16" y="99" font-size="13" fill="#475467">Check the spoken language.</text><text x="16" y="128" font-size="13" fill="#475467">Initialize English recognition.</text><text x="16" y="157" font-size="13" fill="#475467">Transcribe, then review the words.</text></g></g></svg>