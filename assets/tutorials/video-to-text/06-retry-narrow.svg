<svg xmlns="http://www.w3.org/2000/svg" width="352" height="505" viewBox="0 0 352 505" role="img"><title>Recover from a decode error</title><desc>Real decode error with the Try the same input again control, produced by an intentionally invalid teaching file.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Recover from a decode error</text><g transform="translate(8 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Read the actual failure</text><image x="16" y="58" width="304" height="112.58746355685132" href="data:image/png;base64,"/></g><g transform="translate(8 283)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Choose a usable recording</text><text x="16" y="70" font-size="13" fill="#475467">Check the audio codec.</text><text x="16" y="99" font-size="13" fill="#475467">Convert using a media editor.</text><text x="16" y="128" font-size="13" fill="#475467">Renaming is not conversion.</text><text x="16" y="157" font-size="13" fill="#475467">Retry after controls unlock.</text></g></g></svg>