<svg xmlns="http://www.w3.org/2000/svg" width="720" height="419" viewBox="0 0 720 419" role="img"><title>Choose the mode for your source</title><desc>The two input modes above the practice text: use plain text timing for TXT, existing timestamps for SRT or VTT.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="19" font-weight="700">Choose the mode for your source</text><g transform="translate(8 57)"><rect width="336" height="350" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Choose the input mode</text><image x="16" y="58" width="304" height="43.33414239482201" href="data:image/png;base64,"/><text x="16" y="129.334142394822" font-size="13" fill="#475467">TXT: Plain text timing.</text><text x="16" y="158.334142394822" font-size="13" fill="#475467">SRT / VTT: Existing timestamps.</text></g><g transform="translate(368 57)"><rect width="336" height="350" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Check the source words</text><image x="16" y="58" width="304" height="240.22087378640776" href="data:image/png;base64,"/><text x="16" y="326.22087378640776" font-size="13" fill="#475467">Three numbered practice lines.</text></g></g></svg>