<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" role="img"><title>Save and inspect the actual file</title><desc>Copy SRT, Download SRT and Download VTT controls alongside the actual edited SRT excerpt.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="19" font-weight="700">Save and inspect the actual file</text><g transform="translate(8 57)"><rect width="336" height="257" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Choose your output</text><image x="16" y="58" width="304" height="147.5728155339806" href="data:image/png;base64,"/><text x="16" y="233.5728155339806" font-size="13" fill="#475467">Both downloads use current rows.</text></g><g transform="translate(368 57)"><rect width="336" height="257" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Read the saved SRT</text><rect x="16" y="54" width="304" height="84" rx="6" fill="#f6f7f8"/><text x="23" y="72" font-family="Consolas,monospace" font-size="12">1</text><text x="23" y="94" font-family="Consolas,monospace" font-size="12">00:00:00,000 --&gt; 00:00:04,000</text><text x="23" y="116" font-family="Consolas,monospace" font-size="12">Open the blue garden gate.</text><text x="16" y="166" font-size="13" fill="#475467">Actual download after regeneration.</text></g></g></svg>