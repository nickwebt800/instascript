<svg xmlns="http://www.w3.org/2000/svg" width="352" height="538" viewBox="0 0 352 538" role="img"><title>Set duration, then check the times</title><desc>Default duration is three seconds and the entry gap is 0.1 seconds; the first generated cue starts at zero and ends at three seconds.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Set duration, then check the times</text><g transform="translate(8 57)"><rect width="336" height="243" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Set seconds, not a video speed</text><image x="16" y="58" width="192.5" height="58.796875" href="data:image/png;base64,"/><image x="16" y="132.796875" width="192.5" height="58.796875" href="data:image/png;base64,"/><text x="16" y="219.59375" font-size="13" fill="#475467">Defaults: 3 seconds + 0.1 gap.</text></g><g transform="translate(8 316)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Read the first cue boundaries</text><image x="16" y="58" width="140" height="35" href="data:image/png;base64,"/><image x="16" y="109" width="140" height="35" href="data:image/png;base64,"/><text x="16" y="172" font-size="13" fill="#475467">Start 0.000 / End 3.000 seconds.</text></g></g></svg>