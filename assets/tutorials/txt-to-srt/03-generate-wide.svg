<svg xmlns="http://www.w3.org/2000/svg" width="720" height="279" viewBox="0 0 720 279" role="img"><title>Generate, then inspect the rows</title><desc>Generate timeline produces the status message 3 entries ready to edit.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="19" font-weight="700">Generate, then inspect the rows</text><g transform="translate(8 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Build from the source box</text><image x="16" y="58" width="169" height="42" href="data:image/png;base64,"/><text x="16" y="128" font-size="13" fill="#475467">Regenerating replaces row edits.</text></g><g transform="translate(368 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Read the status</text><image x="16" y="58" width="304" height="22.151294498381876" href="data:image/png;base64,"/><text x="16" y="108.15129449838187" font-size="13" fill="#475467">Default practice: three cues.</text><text x="16" y="137.15129449838187" font-size="13" fill="#475467">Check first and last boundaries.</text></g></g></svg>