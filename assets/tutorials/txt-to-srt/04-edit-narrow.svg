<svg xmlns="http://www.w3.org/2000/svg" width="352" height="505" viewBox="0 0 352 505" role="img"><title>Review every changed caption</title><desc>The caption is edited to Open the blue garden gate; start and end times must be checked separately.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Review every changed caption</text><g transform="translate(8 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Change the words in a row</text><image x="16" y="58" width="304" height="42.973821989528794" href="data:image/png;base64,"/><text x="16" y="128.9738219895288" font-size="13" fill="#475467">Teaching edit: add “blue”.</text></g><g transform="translate(8 283)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Check timing separately</text><image x="16" y="58" width="140" height="35" href="data:image/png;base64,"/><image x="16" y="109" width="140" height="35" href="data:image/png;base64,"/><text x="16" y="172" font-size="13" fill="#475467">Longer text does not extend End.</text></g></g></svg>