<svg xmlns="http://www.w3.org/2000/svg" width="720" height="202" viewBox="0 0 720 202"><title>Three sources, three different jobs</title><desc>Conceptual guide, not an app screenshot. Post description. Written beside the post. Read and note separately. Spoken words. Audible English speech. Use transcription. On-screen text. Words in the picture. No OCR in this workflow</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="16" y="28" fill="#172033" font-size="17">Three sources, three different jobs</text><g transform="translate(8 53)"><rect width="224" height="133" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">Post description</text><text x="16" y="87" fill="#475467" font-size="13">Written beside the post</text><text x="16" y="121" fill="#475467" font-size="13">Read and note separately</text></g><g transform="translate(248 53)"><rect width="224" height="133" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">Spoken words</text><text x="16" y="87" fill="#475467" font-size="13">Audible English speech</text><text x="16" y="121" fill="#475467" font-size="13">Use transcription</text></g><g transform="translate(488 53)"><rect width="224" height="133" rx="8" fill="#fff" stroke="#d5dbe3"/><rect x="16" y="18" width="28" height="3" fill="#d9533f"/><text x="16" y="50" fill="#172033" font-size="16">On-screen text</text><text x="16" y="87" fill="#475467" font-size="13">Words in the picture</text><text x="16" y="121" fill="#475467" font-size="13">No OCR in this workflow</text></g></g></svg>