<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" role="img"><title>A trimmed copy has a different clock</title><desc>Invented six-second trim exercise, not a measurement.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="34" font-size="20" font-weight="700">A trimmed copy has a different clock</text><g transform="translate(8 62)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="14" font-weight="700">Original recording</text><text x="16" y="74" font-size="13" fill="#475467">Spoken instruction: 00:18</text><text x="16" y="103" font-size="13" fill="#475467">Includes a six-second opening slate.</text><text x="16" y="132" font-size="13" fill="#475467">Keep original subtitles with this file.</text></g><g transform="translate(368 62)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="14" font-weight="700">Copy with the slate removed</text><text x="16" y="74" font-size="13" fill="#475467">Same instruction: 00:12</text><text x="16" y="103" font-size="13" fill="#475467">00:18 − 00:06 = 00:12</text><text x="16" y="132" font-size="13" fill="#475467">Invented exercise; same speed only.</text><text x="16" y="161" font-size="13" fill="#475467">Cuts or speed changes need review.</text></g></g></svg>