<svg xmlns="http://www.w3.org/2000/svg" width="720" height="302" viewBox="0 0 720 302" role="img"><title>Read the stage that failed</title><desc>Actual interface crops. Invalid-file and prepared-sample demonstrations are labeled.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="34" font-size="20" font-weight="700">Read the stage that failed</text><g transform="translate(8 62)"><rect width="336" height="228" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="14" font-weight="700">Actual decode-error demonstration</text><image x="16" y="62" width="304" height="112.58746355685132" href="data:image/png;base64,"/><text x="16" y="202.58746355685133" font-size="13" fill="#475467">Deliberately invalid audio file.</text></g><g transform="translate(368 62)"><rect width="336" height="228" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="14" font-weight="700">Choose the matching next step</text><text x="16" y="74" font-size="13" fill="#475467">Decode error: inspect the file.</text><text x="16" y="103" font-size="13" fill="#475467">Technical failure: check and retry.</text><text x="16" y="132" font-size="13" fill="#475467">Uncertain language: review speech.</text><text x="16" y="161" font-size="13" fill="#475467">Detected non-English is separate.</text></g></g></svg>