<svg xmlns="http://www.w3.org/2000/svg" width="352" height="644" viewBox="0 0 352 644" role="img"><title>Replace the prefilled source wording</title><desc>Actual InstaScript interface crops with a fictional subtitle practice file and manually entered Spanish text.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="16" font-weight="700">Replace the prefilled source wording</text><g transform="translate(8 58)"><rect width="336" height="230" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">The field starts in English</text><image x="16" y="62" width="304" height="98.06451612903226" href="data:image/png;base64,"/><text x="16" y="188.06451612903226" font-size="13" fill="#475467">This is source text, not a translation.</text></g><g transform="translate(8 304)"><rect width="336" height="328" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Type your target-language text</text><image x="16" y="62" width="304" height="98.06451612903226" href="data:image/png;base64,"/><image x="16" y="176.06451612903226" width="304" height="98.06451612903226" href="data:image/png;base64,"/><text x="16" y="302.1290322580645" font-size="13" fill="#475467">Illustrative Spanish wording, typed by hand.</text></g></g></svg>