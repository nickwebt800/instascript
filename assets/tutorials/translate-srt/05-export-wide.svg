<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img"><title>Export SRT with the same timecodes</title><desc>Actual InstaScript interface crops with a fictional subtitle practice file and manually entered Spanish text.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="19" font-weight="700">Export SRT with the same timecodes</text><g transform="translate(8 58)"><rect width="336" height="230" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Check, then download</text><image x="16" y="62" width="304" height="41.320388349514566" href="data:image/png;base64,"/><image x="16" y="119.32038834951456" width="304" height="21.083870967741934" href="data:image/png;base64,"/><text x="16" y="168.4042593172565" font-size="13" fill="#475467">All three cue times stay unchanged.</text></g><g transform="translate(368 58)"><rect width="336" height="230" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Inspect the saved SRT</text><rect x="16" y="57" width="304" height="92" rx="6" fill="#f6f7f8" stroke="#d5dbe3"/><text x="25" y="78" font-family="Consolas,monospace" font-size="13">1</text><text x="25" y="101" font-family="Consolas,monospace" font-size="13">00:00:02,000 --&gt; 00:00:04,000</text><text x="25" y="124" font-family="Consolas,monospace" font-size="13">Deja aquí la bolsa azul</text><text x="16" y="173" font-size="13" fill="#475467">New wording, original start and end.</text></g></g></svg>