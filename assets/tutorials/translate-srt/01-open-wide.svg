<svg xmlns="http://www.w3.org/2000/svg" width="720" height="348" viewBox="0 0 720 348" role="img"><title>Open an existing subtitle file</title><desc>Actual InstaScript interface crops with a fictional subtitle practice file and manually entered Spanish text.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="19" font-weight="700">Open an existing subtitle file</text><g transform="translate(8 58)"><rect width="336" height="278" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="44" y="30" font-size="15" font-weight="700">Choose SRT or VTT</text><image x="16" y="62" width="134" height="42" href="data:image/png;base64,"/><image x="16" y="120" width="304" height="44.30258899676375" href="data:image/png;base64,"/><text x="16" y="192.30258899676375" font-size="13" fill="#475467">The cues load automatically.</text></g><g transform="translate(368 58)"><rect width="336" height="278" rx="8" fill="#fff" stroke="#d5dbe3"/><circle cx="24" cy="25" r="12" fill="#b94332"/><text x="24" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="44" y="30" font-size="15" font-weight="700">Read the source and its time</text><image x="16" y="62" width="304" height="21.083870967741934" href="data:image/png;base64,"/><image x="16" y="99.08387096774193" width="304" height="125.52258064516128" href="data:image/png;base64,"/><text x="16" y="252.6064516129032" font-size="13" fill="#475467">Keep an untouched source copy.</text></g></g></svg>