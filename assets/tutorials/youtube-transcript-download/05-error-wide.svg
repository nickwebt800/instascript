<svg xmlns="http://www.w3.org/2000/svg" width="720" height="305" viewBox="0 0 720 305" role="img"><title>Use the error to choose a next step</title><desc>Actual query error reporting that a caption track exists but returned no text, with recovery choices.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="19" font-weight="700">Use the error to choose a next step</text><g transform="translate(8 57)"><rect width="336" height="236" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Check the actual response</text><image x="16" y="58" width="304" height="126.36661807580175" href="data:image/png;base64,"/><text x="16" y="212.36661807580174" font-size="13" fill="#475467">Observed during a real query.</text></g><g transform="translate(368 57)"><rect width="336" height="236" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Choose a recovery path</text><text x="16" y="70" font-size="13" fill="#475467">Check captions on YouTube.</text><text x="16" y="99" font-size="13" fill="#475467">Retry later for service failures.</text><text x="16" y="128" font-size="13" fill="#475467">No missing track is created here.</text><text x="16" y="157" font-size="13" fill="#475467">Transcribe a permitted local file.</text></g></g></svg>