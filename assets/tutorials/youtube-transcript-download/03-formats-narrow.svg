<svg xmlns="http://www.w3.org/2000/svg" width="352" height="593" viewBox="0 0 352 593" role="img"><title>Choose the file for the next job</title><desc>Prepared example of timestamp/plain-text and download controls, with actual practice TXT exports with and without timestamps. Prepared teaching example, not a successful live YouTube lookup.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Choose the file for the next job</text><text x="16" y="57" font-size="12" fill="#8b3527">Prepared example — not a live lookup</text><g transform="translate(8 79)"><rect width="336" height="274" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Choose a view and export</text><image x="16" y="58" width="301" height="136" href="data:image/png;base64,"/><text x="16" y="222" font-size="13" fill="#475467">TXT / Markdown follow the view.</text><text x="16" y="251" font-size="13" fill="#475467">SRT retains subtitle time ranges.</text></g><g transform="translate(8 369)"><rect width="336" height="212" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Compare the actual TXT files</text><rect x="16" y="54" width="304" height="62" rx="6" fill="#f6f7f8"/><text x="23" y="72" font-family="Consolas,monospace" font-size="12">[00:00] Open the garden gate.</text><text x="23" y="94" font-family="Consolas,monospace" font-size="12">[00:03] Walk along the path.</text><rect x="16" y="128" width="304" height="62" rx="6" fill="#f6f7f8"/><text x="23" y="146" font-family="Consolas,monospace" font-size="12">Open the garden gate. Walk along</text><text x="23" y="168" font-family="Consolas,monospace" font-size="12">the path.</text></g></g></svg>