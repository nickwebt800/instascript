<svg xmlns="http://www.w3.org/2000/svg" width="352" height="553" viewBox="0 0 352 553" role="img"><title>Select a language, then submit again</title><desc>Prepared example showing Caption language before and after selecting Spanish, with the instruction to submit again. Prepared teaching example, not a successful live YouTube lookup.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Select a language, then submit again</text><text x="16" y="57" font-size="12" fill="#8b3527">Prepared example — not a live lookup</text><g transform="translate(8 79)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Choose an available track</text><image x="16" y="58" width="304" height="97.27508090614887" href="data:image/png;base64,"/><text x="16" y="183.27508090614887" font-size="13" fill="#475467">Prepared two-language example.</text></g><g transform="translate(8 305)"><rect width="336" height="236" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. After selecting Spanish</text><image x="16" y="58" width="304" height="97.27508090614887" href="data:image/png;base64,"/><text x="16" y="183.27508090614887" font-size="13" fill="#475467">The old result is cleared.</text><text x="16" y="212.27508090614887" font-size="13" fill="#475467">Choose Download Transcript again.</text></g></g></svg>