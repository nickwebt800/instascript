<svg xmlns="http://www.w3.org/2000/svg" width="352" height="505" viewBox="0 0 352 505" role="img"><title>Look up the video before saving</title><desc>The YouTube URL form and actual Paste a YouTube link first validation message.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Look up the video before saving</text><g transform="translate(8 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Paste a public YouTube link</text><image x="16" y="58" width="304" height="96.41423948220064" href="data:image/png;base64,"/><text x="16" y="182.41423948220063" font-size="13" fill="#475467">This button starts the lookup.</text></g><g transform="translate(8 283)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. A blank input needs a link</text><image x="16" y="58" width="304" height="46.54446064139942" href="data:image/png;base64,"/><text x="16" y="132.5444606413994" font-size="13" fill="#475467">An actual empty-input message.</text></g></g></svg>