<svg xmlns="http://www.w3.org/2000/svg" width="720" height="301" viewBox="0 0 720 301" role="img"><title>Inspect words and time ranges</title><desc>Prepared caption Open the garden gate and its exported SRT time range from zero to three seconds. Prepared teaching example, not a successful live YouTube lookup.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="19" font-weight="700">Inspect words and time ranges</text><text x="16" y="57" font-size="12" fill="#8b3527">Prepared example — not a live lookup</text><g transform="translate(8 79)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Read a caption in the result</text><image x="16" y="58" width="301" height="41.015625" href="data:image/png;base64,"/><text x="16" y="127.015625" font-size="13" fill="#475467">Prepared teaching text.</text></g><g transform="translate(368 79)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Read the saved SRT cue</text><rect x="16" y="54" width="304" height="84" rx="6" fill="#f6f7f8"/><text x="23" y="72" font-family="Consolas,monospace" font-size="12">1</text><text x="23" y="94" font-family="Consolas,monospace" font-size="12">00:00:00,000 --&gt; 00:00:03,000</text><text x="23" y="116" font-family="Consolas,monospace" font-size="12">Open the garden gate.</text><text x="16" y="166" font-size="13" fill="#475467">Actual prepared-example export.</text></g></g></svg>