<svg xmlns="http://www.w3.org/2000/svg" width="352" height="340" viewBox="0 0 352 340" role="img"><title>Open the native transcript</title><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="33" font-size="17" font-weight="700">Open the native transcript</text><text x="16" y="63" font-size="12" fill="#475467">YouTube Help flow · layout may vary</text><rect x="16" y="96" width="320" height="58" rx="6" fill="#fff" stroke="#d5dbe3"/><text x="28" y="131" font-size="14">1  Open the video description</text><rect x="16" y="172" width="320" height="58" rx="6" fill="#fff" stroke="#d5dbe3"/><text x="28" y="207" font-size="14">2  Choose Show transcript, if offered</text><rect x="16" y="248" width="320" height="58" rx="6" fill="#fff" stroke="#d5dbe3"/><text x="28" y="283" font-size="14">3  Select a caption line to jump back</text></g></svg>