<svg xmlns="http://www.w3.org/2000/svg" width="352" height="572" viewBox="0 0 352 572" role="img"><title>Inspect dialogue after conversion</title><desc>Actual SRT result containing numbered dialogue, millisecond timecodes and a line break, with notes on stripped ASS overrides.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Inspect dialogue after conversion</text><g transform="translate(8 57)"><rect width="336" height="277" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Read the actual SRT result</text><image x="16" y="58" width="304" height="196.76375404530745" href="data:image/png;base64,"/></g><g transform="translate(8 350)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Check what was changed</text><text x="16" y="70" font-size="13" fill="#475467">1.20 seconds becomes 1,200 ms.</text><text x="16" y="99" font-size="13" fill="#475467">ASS line breaks become new lines.</text><text x="16" y="128" font-size="13" fill="#475467">Inline override blocks are removed.</text><text x="16" y="157" font-size="13" fill="#475467">SRT does not recreate ASS styling.</text></g></g></svg>