<svg xmlns="http://www.w3.org/2000/svg" width="352" height="505" viewBox="0 0 352 505" role="img"><title>Save the corrected result text</title><desc>Copy SRT and Download SRT controls with the actual saved first cue edited to Open the blue gate.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Save the corrected result text</text><g transform="translate(8 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Copy or download current text</text><image x="16" y="58" width="304" height="94.44660194174757" href="data:image/png;base64,"/><text x="16" y="180.4466019417476" font-size="13" fill="#475467">Regenerating replaces your edits.</text></g><g transform="translate(8 283)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Inspect the actual edited SRT</text><rect x="16" y="54" width="304" height="84" rx="6" fill="#f6f7f8"/><text x="23" y="72" font-family="Consolas,monospace" font-size="12">1</text><text x="23" y="94" font-family="Consolas,monospace" font-size="12">00:00:01,200 --&gt; 00:00:03,400</text><text x="23" y="116" font-family="Consolas,monospace" font-size="12">Open the blue gate.</text><text x="16" y="166" font-size="13" fill="#475467">“blue” was added in the result box.</text></g></g></svg>