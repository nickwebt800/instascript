<svg xmlns="http://www.w3.org/2000/svg" width="352" height="505" viewBox="0 0 352 505" role="img"><title>Open the source, then convert</title><desc>Open ASS or SSA, Convert to SRT, and the actual 2 cues ready to review summary.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172033"><text x="16" y="32" font-size="15" font-weight="700">Open the source, then convert</text><g transform="translate(8 57)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">1. Select ASS or SSA</text><image x="16" y="58" width="304" height="41.320388349514566" href="data:image/png;base64,"/><image x="16" y="115.32038834951456" width="304" height="41.320388349514566" href="data:image/png;base64,"/></g><g transform="translate(8 283)"><rect width="336" height="210" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="29" font-size="15" font-weight="700">2. Check the converted cue count</text><image x="16" y="58" width="304" height="21.15210355987055" href="data:image/png;base64,"/><text x="16" y="107.15210355987055" font-size="13" fill="#475467">The practice file has two cues.</text></g></g></svg>