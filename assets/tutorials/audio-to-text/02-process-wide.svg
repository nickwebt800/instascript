<svg xmlns="http://www.w3.org/2000/svg" width="720" height="327" viewBox="0 0 720 327"><title>What is the language and model-loading sequence?</title><desc>Crops of the actual local tool on October 23, 2026.</desc><rect width="100%" height="100%" fill="#f6f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="16" y="28" fill="#172033" font-size="17">What is the language and model-loading sequence?</text><g transform="translate(8 51)"><rect width="336" height="263.77623906705537" rx="8" fill="#fff" stroke="#d5dbe3"/><image x="16" y="20" width="304" height="223.7762390670554" href="data:image/png;base64,"/></g><g transform="translate(368 51)"><rect width="336" height="263.77623906705537" rx="8" fill="#fff" stroke="#d5dbe3"/><text x="16" y="38" fill="#172033" font-size="15">Check before continuing</text><text x="16" y="78" fill="#475467" font-size="14">Wait for a transcript or a</text><text x="16" y="99" fill="#475467" font-size="14">specific error; a progress screen</text><text x="16" y="120" fill="#475467" font-size="14">alone is not a result.</text></g></g></svg>