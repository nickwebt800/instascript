<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">Keep the contrast visible</title><desc id="desc">Source: A then B then A Collapsed: One label hides the return Retained: A and B keep the relation</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="72" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Keep the contrast visible</text><rect x="48" y="200" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="200" width="6" height="205" fill="#b94332"/><text x="76" y="253" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Source</text><text x="76" y="309" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">A then B then A</text><rect x="48" y="440" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="440" width="6" height="205" fill="#b94332"/><text x="76" y="493" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Collapsed</text><text x="76" y="549" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">One label hides the return</text><rect x="48" y="680" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="680" width="6" height="205" fill="#b94332"/><text x="76" y="733" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Retained</text><text x="76" y="789" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">A and B keep the relation</text><text x="48" y="1016" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">CONTRAST-R24: invented text, no</text><text x="48" y="1053" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">participant or recording.</text></svg>