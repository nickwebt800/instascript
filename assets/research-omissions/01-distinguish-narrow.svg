<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">Name the missing text</title><desc id="desc">Unknown speech: Keep the unresolved marker. Known words cut: Record the editorial omission. Source version: Keep the unchanged passage.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="72" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Name the missing text</text><rect x="48" y="200" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="200" width="6" height="205" fill="#b94332"/><text x="76" y="253" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Unknown speech</text><text x="76" y="309" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Keep the unresolved marker.</text><rect x="48" y="440" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="440" width="6" height="205" fill="#b94332"/><text x="76" y="493" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Known words cut</text><text x="76" y="549" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Record the editorial omission.</text><rect x="48" y="680" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="680" width="6" height="205" fill="#b94332"/><text x="76" y="733" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Source version</text><text x="76" y="789" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Keep the unchanged passage.</text><text x="48" y="1016" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">Invented text; no participant or</text><text x="48" y="1053" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">recording.</text></svg>