<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Review meaning separately</title><desc id="desc">Original: I did not prefer the screen. Unsafe cut: I did [cut] prefer the screen. Review decision: Reject the reversed meaning.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="72" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Review meaning separately</text><rect x="48" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="48" y="180" width="6" height="300" fill="#b94332"/><text x="76" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Original</text><text x="76" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">I did not prefer the</text><text x="76" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">screen.</text><rect x="430" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="430" y="180" width="6" height="300" fill="#b94332"/><text x="458" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Unsafe cut</text><text x="458" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">I did [cut] prefer</text><text x="458" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">the screen.</text><rect x="812" y="180" width="340" height="300" rx="10" fill="#f5f7fa"/><rect x="812" y="180" width="6" height="300" fill="#b94332"/><text x="840" y="233" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Review decision</text><text x="840" y="320" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Reject the reversed</text><text x="840" y="360" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">meaning.</text><text x="48" y="596" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">The reversal label is authored, not detected by code.</text></svg>