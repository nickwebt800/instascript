<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img"><title>Keep the source in order</title><rect width="360" height="430" rx="12" fill="#f5f7fa"/><g font-family="Segoe UI,Arial" fill="#172033"><text x="20" y="35" font-size="20" font-weight="700">Keep the source in order</text><rect x="16" y="64" width="328" height="82" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="30" y="92" font-size="17" font-weight="700">T01 → T02</text><text x="30" y="121" font-size="16">Finding the room: arrows helped</text><rect x="16" y="160" width="328" height="82" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="30" y="188" font-size="17" font-weight="700">T03 → T04</text><text x="30" y="217" font-size="16">Booking form: “That was confusing.”</text><rect x="16" y="256" width="328" height="82" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="30" y="284" font-size="17" font-weight="700">T05 → T06</text><text x="30" y="313" font-size="16">Back to room: arrows stopped</text><text x="20" y="392" font-size="16">Topic view selects T06, then T02.</text><text x="20" y="416" font-size="14">Fictional ROOM-R19 · no recording</text></g></svg>