<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">Preserve repeats and unresolved links</title><desc id="desc">Same words later: B local 24 to 27 maps to session 74 to 77 Missing clock map: Keep the relationship unresolved Reading copy: Keep both original source locators</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="72" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Preserve repeats and unresolved</text><text x="48" y="120" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">links</text><rect x="48" y="200" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="200" width="6" height="205" fill="#b94332"/><text x="76" y="253" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Same words later</text><text x="76" y="309" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">B local 24 to 27 maps to</text><text x="76" y="349" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">session 74 to 77</text><rect x="48" y="440" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="440" width="6" height="205" fill="#b94332"/><text x="76" y="493" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Missing clock map</text><text x="76" y="549" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Keep the relationship</text><text x="76" y="589" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">unresolved</text><rect x="48" y="680" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="680" width="6" height="205" fill="#b94332"/><text x="76" y="733" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Reading copy</text><text x="76" y="789" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Keep both original source</text><text x="76" y="829" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">locators</text><text x="48" y="1016" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">Fourteen record checks do not review</text><text x="48" y="1053" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">audio or remove passages.</text></svg>