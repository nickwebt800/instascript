<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">Keep both recording clocks</title><desc id="desc">File A / V1: Local 54 to 57 maps to session 54 to 57 File B / V1: Local 4 to 7 maps to session 54 to 57 Review candidate: Same coordinates do not prove same event</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="72" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Keep both recording clocks</text><rect x="48" y="200" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="200" width="6" height="205" fill="#b94332"/><text x="76" y="253" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">File A / V1</text><text x="76" y="309" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Local 54 to 57 maps to session</text><text x="76" y="349" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">54 to 57</text><rect x="48" y="440" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="440" width="6" height="205" fill="#b94332"/><text x="76" y="493" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">File B / V1</text><text x="76" y="549" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Local 4 to 7 maps to session</text><text x="76" y="589" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">54 to 57</text><rect x="48" y="680" width="624" height="205" rx="10" fill="#f5f7fa"/><rect x="48" y="680" width="6" height="205" fill="#b94332"/><text x="76" y="733" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Review candidate</text><text x="76" y="789" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">Same coordinates do not prove</text><text x="76" y="829" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">same event</text><text x="48" y="1016" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">Fictional SEAM-R27. The clock map is</text><text x="48" y="1053" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400">authored, not verified.</text></svg>